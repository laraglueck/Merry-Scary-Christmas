# Puts the browser version of the game (the folder web/, made by Godot's "Web" export)
# online with GitHub Pages, every time main changes (spec 32).
# One-time setup by the repository owner: Settings -> Pages -> Source: "GitHub Actions".
name: Web version on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
